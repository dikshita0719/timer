<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d9eef4" />
    <meta name="description" content="A local clock, timer, and stopwatch with expressive visual moods." />
    <title>Clockwork - Time, your way</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-theme="pixel">
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Clockwork home">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>clockwork</span>
        </a>
        <div class="topbar-tools">
          <nav class="mode-tabs" aria-label="Time tools">
            <button class="mode-tab is-active" type="button" data-mode-choice="timer" aria-pressed="true">Timer</button>
            <button class="mode-tab" type="button" data-mode-choice="stopwatch" aria-pressed="false">Stopwatch</button>
            <button class="mode-tab" type="button" data-mode-choice="clock" aria-pressed="false">Clock</button>
          </nav>
          <button class="topbar-focus" id="fullscreen-button" type="button" title="Open timer focus view">
            <span class="fullscreen-glyph" aria-hidden="true"></span><span>Focus view</span>
          </button>
        </div>
      </header>

      <main>
        <section class="workspace" aria-label="Time tools and appearance controls">
          <article class="tool-card">
            <div class="tool-heading">
              <div>
                <p class="section-kicker" id="tool-kicker">Deep work interval</p>
                <h2 id="tool-title">Focus timer</h2>
              </div>
              <span class="live-label"><span class="live-pulse" aria-hidden="true"></span><span id="tool-status">Ready</span></span>
            </div>

            <div class="tool-view timer-view" data-mode-view="timer" aria-live="polite">
              <div class="tool-display timer-display" id="timer-display">25:00</div>
              <div class="timer-progress"><span id="timer-progress-bar"></span></div>
              <div class="preset-row" aria-label="Timer presets">
                <button class="preset-button is-selected" type="button" data-duration="1500">25 min</button>
                <button class="preset-button" type="button" data-duration="300">5 min</button>
                <button class="preset-button" type="button" data-duration="900">15 min</button>
                <button class="preset-button" type="button" data-duration="2700">45 min</button>
                <label class="custom-duration"><span>Custom</span><input id="custom-minutes" type="number" min="1" max="999" inputmode="numeric" placeholder="min" aria-label="Custom timer minutes" /></label>
              </div>
            </div>

            <div class="tool-view stopwatch-view" data-mode-view="stopwatch" aria-live="polite" hidden>
              <div class="tool-display stopwatch-display" id="stopwatch-display">00:00.00</div>
              <div class="lap-list" id="lap-list"><p class="empty-laps">Laps will appear here as you work.</p></div>
            </div>

            <div class="tool-view clock-view" data-mode-view="clock" aria-live="polite" hidden>
              <div class="clock-time"><span id="hours">09</span><span class="time-colon">:</span><span id="minutes">24</span><span class="time-seconds"><span id="seconds">07</span></span></div>
              <div class="clock-date"><span id="long-date">Tuesday, September 24, 2026</span><span class="date-divider">/</span><span id="timezone">Local time</span></div>
            </div>

            <div class="tool-actions">
              <button class="primary-action" id="start-button" type="button"><span class="play-glyph" aria-hidden="true"></span><span id="start-label">Start timer</span></button>
              <button class="secondary-action" id="lap-button" type="button" hidden><span class="lap-glyph" aria-hidden="true"></span>Lap</button>
              <button class="secondary-action" id="reset-button" type="button"><span class="reset-glyph" aria-hidden="true"></span>Reset</button>
              <button class="focus-action" id="focus-button" type="button"><span class="fullscreen-glyph" aria-hidden="true"></span>Full screen timer</button>
            </div>
          </article>

          <aside class="appearance-panel" aria-labelledby="appearance-title">
            <div class="panel-heading">
              <div>
                <h2 id="appearance-title">Themes</h2>
              </div>
              <span class="palette-icon" aria-hidden="true"></span>
            </div>
            <div class="theme-list" role="group" aria-label="Clock appearance themes">
              <button class="theme-option is-active" type="button" data-theme-choice="pixel" aria-pressed="true">
                <span class="theme-swatch swatch-pixel" aria-hidden="true"><span></span></span>
                <span class="theme-copy"><strong>Pixel arcade</strong></span>
                <span class="theme-check" aria-hidden="true">+</span>
              </button>
              <button class="theme-option" type="button" data-theme-choice="minecraft" aria-pressed="false">
                <span class="theme-swatch swatch-minecraft" aria-hidden="true"><span></span></span>
                <span class="theme-copy"><strong>Minecraft</strong></span>
                <span class="theme-check" aria-hidden="true">+</span>
              </button>
              <button class="theme-option" type="button" data-theme-choice="noir" aria-pressed="false">
                <span class="theme-swatch swatch-noir" aria-hidden="true"><span></span></span>
                <span class="theme-copy"><strong>Midnight noir</strong></span>
                <span class="theme-check" aria-hidden="true">+</span>
              </button>
              <button class="theme-option" type="button" data-theme-choice="botanical" aria-pressed="false">
                <span class="theme-swatch swatch-botanical" aria-hidden="true"><span></span></span>
                <span class="theme-copy"><strong>Botanical studio</strong></span>
                <span class="theme-check" aria-hidden="true">+</span>
              </button>
              <button class="theme-option" type="button" data-theme-choice="sunset" aria-pressed="false">
                <span class="theme-swatch swatch-sunset" aria-hidden="true"><span></span></span>
                <span class="theme-copy"><strong>Soft sunset</strong></span>
                <span class="theme-check" aria-hidden="true">+</span>
              </button>
              <button class="theme-option" type="button" data-theme-choice="ocean" aria-pressed="false">
                <span class="theme-swatch swatch-ocean" aria-hidden="true"><span></span></span>
                <span class="theme-copy"><strong>Ocean air</strong></span>
                <span class="theme-check" aria-hidden="true">+</span>
              </button>
            </div>
          </aside>
        </section>
      </main>
    </div>
    <section class="focus-stage" id="focus-stage" aria-label="Fullscreen focus timer" hidden>
      <div class="focus-stage-topline"><span class="brand-mark" aria-hidden="true"><span></span></span><span>clockwork / focus</span><button id="exit-focus-button" type="button" title="Exit focus view"><span class="close-glyph" aria-hidden="true"></span><span>Exit</span></button></div>
      <div class="focus-stage-center"><p>FOCUS TIMER</p><div id="focus-display">25:00</div><span id="focus-status">Ready when you are</span><button class="focus-stage-toggle" id="focus-toggle" type="button">Start timer</button></div>
      <div class="focus-stage-bottom"><span>Local only</span><span id="focus-theme-label">Pixel arcade</span></div>
    </section>
    <script src="./main.js"></script>
  </body>
</html>
